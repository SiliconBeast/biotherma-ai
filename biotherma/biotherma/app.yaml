name: BioTherma-AI
description: >
  Edge-AI thermal and humidity state estimator for small-scale anaerobic
  bio-digesters. STM32 handles real-time acquisition; the Qualcomm MPU runs
  a GRU forecaster and flags deviation from learned normal operation.

# Brick IDs below match App Lab 0.7. If your install reports an unknown brick,
# open the Bricks panel and copy the exact id from there -- Arduino renamed a
# couple of these between 0.5 and 0.7.
bricks:
  - id: web-ui-html
    config:
      port: 7000
      entrypoint: Assets/index.html
  - id: time-series
    config:
      database: biotherma
      retention_days: 90

sketch: Sketch/sketch.ino
python: Python/main.py
